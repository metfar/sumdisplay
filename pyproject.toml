[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sumdisplay"
version = "0.1a21"
description = "SUM X11 logical display scaling, brightness, gamma and profiles"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-2.0-or-later"
dependencies = ["sumui>=0.1.0a22"]
authors = [{name = "William Martinez Bas"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Topic :: Desktop Environment",
]

[project.scripts]
sumdisp = "sumdisplay:main"
sumdisplay = "sumdisplay:main"
disp = "sumdisplay:main"
pantalla = "sumdisplay:main"
setBright = "sumdisplay:main"
ajustaBrillo = "sumdisplay:main"

[tool.setuptools]
py-modules = ["sumdisplay"]
